name: LaTeX Compilation

# This workflow runs on pushes to the main branch, on any tag push,
# and on pull requests targeting the main branch.
on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository's code so the workflow can access it.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the TeX Live environment.
      # This action is equivalent to the 'image: texlive/texlive:latest' in your GitLab CI.
      # You can change the 'scheme' to 'basic', 'medium', or 'full' depending on the LaTeX packages you need.
      - name: Set up TeX Live
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full

      # Step 3: Run the 'make' command to compile your document.
      # This corresponds to the 'make' command in your 'script' section.
      - name: Compile LaTeX
        run: make

      # Step 4: Run the 'make clean' command.
      # This corresponds to the 'make clean' command in your 'script' section.
      - name: Clean up
        run: make clean

      # Step 5: Upload the artifacts.
      # This is equivalent to the 'artifacts' section in your GitLab CI.
      # It will take the contents of the 'public' directory and save them as a workflow artifact.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-document
          path: public/
