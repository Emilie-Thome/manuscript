name: LaTeX Compilation

# This workflow runs on pushes to the main branch, on any tag push,
# and on pull requests targeting the main branch.
on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository's code so the workflow can access it.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the TeX Live environment.
      - name: Set up TeX Live
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          packages: latexmk

      # --- DEBUGGING STEPS ---
      # This will show us the exact path where TeX Live binaries are installed.
      - name: Show TeX Live bin path
        run: echo "TeX Live bin path is $(tlmgr path texlive-bin)"

      # This will print the full system PATH. We can check if the TeX Live path is in it.
      - name: Show system PATH
        run: echo $PATH

      # This command asks the system to find the 'latexmk' executable.
      # If it's installed and in the PATH, it will print its location.
      - name: Check for latexmk executable
        run: which latexmk

      # Step 3: Run the 'make' command to compile your document.
      - name: Compile LaTeX
        run: make

      # Step 4: Run the 'make clean' command.
      - name: Clean up
        run: make clean

      # Step 5: Upload the artifacts.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-document
          path: public/
