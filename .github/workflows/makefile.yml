name: LaTeX Compilation

# This workflow runs on pushes to the main branch, on any tag push,
# and on pull requests targeting the main branch.
on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_latex:
    # Run the job on a standard GitHub runner
    runs-on: ubuntu-latest
    
    # Specify a container to run the job's steps in.
    # This is the direct equivalent of GitLab's 'image:' keyword.
    container:
      image: texlive/texlive:latest

    steps:
      # Step 1: Check out your repository's code into the container.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Run the 'make' command.
      # This will now execute inside the texlive container, where 'latexmk' exists.
      - name: Compile LaTeX
        run: make

      # Step 3: Run the 'make clean' command.
      - name: Clean up
        run: make clean

      # Step 4: Upload the artifacts from the 'public' directory.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-document
          path: public/
